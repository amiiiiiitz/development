<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Animation Test</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: #111;
    overflow: hidden;
}

/* Rocket container */
.rocket {
    position: fixed;
    left: 50px;       /* horizontal position */
    width: 40px;
    height: 60px;
    z-index: 999;
    animation: rocketMove 5s linear infinite;
}

/* Rocket image */
.rocket img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Vertical movement animation */
@keyframes rocketMove {
    0% {
        bottom: -60px;     /* start above viewport */
    }
    100% {
        bottom: 110vh;     /* move past bottom */
    }
}
</style>
</head>
<body>

<div class="rocket">
    <img src="red-rocket-png-5.png" alt="Rocket">
</div>

</body>
</html>
