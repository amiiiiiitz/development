<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
      <button type="button" class="choice" id="rock" aria-label="Rock">
        <img src="./images/rock.png" alt="" />
      </button>
      <button type="button" class="choice" id="paper" aria-label="Paper">
        <img src="./images/paper.png" alt="" />
      </button>
      <button type="button" class="choice" id="scissors" aria-label="Scissors">
        <img src="./images/scissors.png" alt="" />
      </button>
    </div>

    <div class="score-board">
      <div class="score">
        <p id="user-score">0</p>
        <p>You</p>
      </div>
      <div class="score">
        <p id="comp-score">0</p>
        <p>Comp</p>
      </div>
    </div>

    <div class="msg-container">
      <p id="msg">Play your move</p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
