<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tools stacking test</title>
<link rel="stylesheet" href="assets/index-B6VICqaf.css" />
<style>
  html, body { margin: 0; padding: 0; background: #f6ecd8; }
  body { padding: 20px; }
  .test-wrap { max-width: 480px; margin: 0 auto; }
</style>
</head>
<body>
<div class="test-wrap">
  <div class="rx-page rx-enter rx-library">
    <header class="rx-lib-header">
      <h1 class="B rx-lib-title-main">ur library</h1>
      <p class="H rx-lib-submain">everything lives offline here</p>
    </header>

    <div class="bd rx-search-bar">
      <svg width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <input type="search" placeholder="search songs or channels" />
    </div>

    <div class="rx-filters">
      <button type="button" class="ch" style="background:#FFD93D">all</button>
      <button type="button" class="ch">folders</button>
      <button type="button" class="ch">favorites</button>
      <button type="button" class="ch">queue (3)</button>
      <label class="ch rx-sort-chip">
        <svg width="14" height="14" aria-hidden="true"><path d="M4 4h12M4 8h8M4 12h10" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <select aria-label="Sort songs">
          <option value="newest">newest first</option>
          <option value="mostPlayed">most played</option>
          <option value="az">A–Z</option>
          <option value="durationAsc">shortest</option>
          <option value="durationDesc">longest</option>
        </select>
      </label>
      <div class="rx-tools-wrap" id="toolsWrap">
        <button type="button" class="ch" aria-expanded="true" id="toolsBtn">
          <svg width="14" height="14" aria-hidden="true"><path d="M4 4h12M4 8h8M4 12h10" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          tools
          <svg width="14" height="14"><polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        </button>
        <div class="rx-menu bd" role="menu" id="toolsMenu">
          <button type="button" role="menuitem"><svg width="14" height="14"><path d="M12 5v14M5 5h14" stroke="currentColor" stroke-width="2" fill="none"/></svg> Export collection</button>
          <button type="button" role="menuitem"><svg width="14" height="14"><path d="M12 5v14M5 5h14" stroke="currentColor" stroke-width="2" fill="none"/></svg> Import collection</button>
          <button type="button" role="menuitem"><svg width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" fill="none"/></svg> Fetch missing covers</button>
          <button type="button" role="menuitem"><svg width="14" height="14"><path d="M12 3v10h5" stroke="currentColor" stroke-width="2" fill="none"/></svg> Personalize signature</button>
        </div>
      </div>
    </div>

    <p class="B rx-section-kicker">NEWEST FIRST</p>
    <div class="rx-lib-grid">
      <article class="bd rx-grid-card"><div class="rx-grid-art"><div class="track-art track-art-recent"><svg width="40" height="40"><circle cx="20" cy="20" r="10" fill="#6B4EFF"/></svg></div></div><div class="rx-grid-meta"><div class="rx-lib-title">Rainy Tea Stall</div><p class="rx-lib-sub">Old Radio Hour</p></div></article>
      <article class="bd rx-grid-card"><div class="rx-grid-art"><div class="track-art track-art-recent"><svg width="40" height="40"><circle cx="20" cy="20" r="10" fill="#F28C38"/></svg></div></div><div class="rx-grid-meta"><div class="rx-lib-title">Paper Moon Waltz</div><p class="rx-lib-sub">Lantern Tapes</p></div></article>
      <article class="bd rx-grid-card"><div class="rx-grid-art"><div class="track-art track-art-recent"><svg width="40" height="40"><circle cx="20" cy="20" r="10" fill="#FFD93D"/></svg></div></div><div class="rx-grid-meta"><div class="rx-lib-title">Midnight Drive</div><p class="rx-lib-sub">Highway Sessions</p></div></article>
      <article class="bd rx-grid-card"><div class="rx-grid-art"><div class="track-art track-art-recent"><svg width="40" height="40"><circle cx="20" cy="20" r="10" fill="#3EE0A0"/></svg></div></div><div class="rx-grid-meta"><div class="rx-lib-title">Cobalt</div><p class="rx-lib-sub">Neon Dreams</p></div></article>
    </div>
  </div>
</div>
</body>
</html>
